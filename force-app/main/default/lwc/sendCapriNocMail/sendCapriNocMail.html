<template>
    <lightning-quick-action-panel header="Send Capri NOC Mail">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <template lwc:if={blockedReason}>
            <p class="slds-text-color_error">{blockedReason}</p>
        </template>

        <template lwc:if={canSend}>
            <p>The mail for <b>{preview.nocName}</b> will be sent to <b>{preview.capriEmail}</b> with these letters:</p>
            <ul class="slds-list_dotted slds-m-top_small">
                <template for:each={preview.attachmentNames} for:item="fileName">
                    <li key={fileName}>{fileName}</li>
                </template>
            </ul>
            <template lwc:if={alreadySent}>
                <p class="slds-m-top_small slds-text-color_error">
                    This mail was already sent on
                    <lightning-formatted-date-time value={preview.lastSentOn} year="numeric" month="short" day="2-digit"
                        hour="2-digit" minute="2-digit" class="slds-m-left_xx-small"></lightning-formatted-date-time>.
                    Sending again mails Capri a second time.
                </p>
            </template>
        </template>

        <div slot="footer">
            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" label={sendLabel} onclick={handleSend} disabled={sendDisabled}
                class="slds-m-left_x-small"></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
