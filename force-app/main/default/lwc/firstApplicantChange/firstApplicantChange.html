<template>
    <lightning-card title="First Applicant Change" icon-name="standard:user">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Working..." size="small"></lightning-spinner>
            </template>

            <template if:true={ctx}>
                <lightning-input label="Current First Applicant" value={currentApplicant} read-only
                    class="slds-m-bottom_small">
                </lightning-input>

                <h3 class="slds-text-title_caps slds-m-bottom_x-small">New First Applicant Details</h3>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    All fields are required.
                </p>

                <!-- Single-line fields: two per row -->
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                        <lightning-input class="fac-field" label="New First Applicant Name" value={newApplicant}
                            required onchange={handleNewApplicant}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                        <lightning-input class="fac-field" type="email" label="New Email" value={newEmail}
                            required onchange={handleNewEmail}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                        <lightning-input class="fac-field" type="tel" label="New Mobile" value={newMobile}
                            required pattern="[0-9]*"
                            message-when-pattern-mismatch="Enter numbers only."
                            onchange={handleNewMobile}>
                        </lightning-input>
                    </div>
                    <template for:each={shortDetails} for:item="d">
                        <div key={d.fieldName} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                            <template if:true={d.isPicklist}>
                                <lightning-combobox class="fac-field" label={d.label} value={d.value}
                                    options={d.options} placeholder="--None--" required
                                    data-field={d.fieldName} onchange={handleDetailChange}>
                                </lightning-combobox>
                            </template>
                            <template if:true={d.isDate}>
                                <lightning-input class="fac-field" type="date" label={d.label} value={d.value}
                                    required data-field={d.fieldName} onchange={handleDetailChange}>
                                </lightning-input>
                            </template>
                            <template if:true={d.isText}>
                                <lightning-input class="fac-field" label={d.label} value={d.value}
                                    required data-field={d.fieldName} onchange={handleDetailChange}>
                                </lightning-input>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Addresses and reason: full width -->
                <template for:each={addressDetails} for:item="d">
                    <lightning-textarea key={d.fieldName} class="fac-field slds-p-bottom_small" label={d.label}
                        value={d.value} required data-field={d.fieldName} onchange={handleDetailChange}>
                    </lightning-textarea>
                </template>
                <lightning-textarea class="fac-field" label="Reason" value={reason} required
                    onchange={handleReason}>
                </lightning-textarea>

                <div class="slds-m-top_medium slds-text-align_right">
                    <lightning-button label="Cancel" variant="neutral" class="slds-m-right_x-small"
                        onclick={handleClose}>
                    </lightning-button>
                    <lightning-button variant="brand" label="Submit for Approval"
                        onclick={handleSubmit} disabled={isLoading}>
                    </lightning-button>
                </div>

                <template if:true={hasChanges}>
                    <div class="slds-m-top_large">
                        <h3 class="slds-text-title_caps slds-m-bottom_x-small">Change Requests</h3>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th>Name</th>
                                    <th>Old</th>
                                    <th>New</th>
                                    <th>Approval</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={changes} for:item="c">
                                    <tr key={c.id}>
                                        <td>
                                            <a href={c.url} data-id={c.id} onclick={handleRecordClick}>{c.name}</a>
                                        </td>
                                        <td>{c.oldApplicant}</td>
                                        <td>{c.newApplicant}</td>
                                        <td>{c.approvalStatus}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
