<template>
    <!-- ==================== MAIN PAYMENT SCHEDULES VIEW ==================== -->
    <template if:true={showMainModal}>
        <div class="modal-container" onclick={handleBackdropClick}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01"
                     aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large"
                     onclick={handleModalClick}>
                <div class="slds-modal__container custom-modal-container">

                    <!-- Header -->
                    <header class="slds-modal__header custom-modal-header">
                        <button class="slds-button slds-button_icon slds-modal__close custom-close-btn"
                                title="Close" onclick={handleClose}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close"
                                          variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <div class="header-top-row">
                            <h2 id="modal-heading-01" class="slds-modal__title slds-text-heading_medium">
                                <lightning-icon icon-name="standard:schedule_objective"
                                              variant="inverse" size="small"></lightning-icon>
                                Payment Schedule Overview
                            </h2>
                            <!-- Step Indicator -->
                            <div class="step-indicator">
                                <div class={step1DotClass}><span class="step-num">1</span></div>
                                <div class="step-line"></div>
                                <div class={step2DotClass}><span class="step-num">2</span></div>
                            </div>
                        </div>
                    </header>

                    <!-- Content -->
                    <div class="slds-modal__content slds-p-around_medium custom-modal-content">

                        <!-- Loading -->
                        <template if:true={isLoading}>
                            <div class="loading-container">
                                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                            </div>
                        </template>

                        <!-- Error -->
                        <template if:true={hasError}>
                            <template if:false={isLoading}>
                                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                                    <span class="slds-icon_container slds-m-right_small">
                                        <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
                                    </span>
                                    <h2>{errorMessage}</h2>
                                </div>
                            </template>
                        </template>

                        <!-- Main Content -->
                        <template if:false={isLoading}>
                            <template if:false={hasError}>

                                <!-- Info Cards -->
                                <div class="slds-m-bottom_medium">
                                    <div class="slds-grid slds-gutters slds-wrap">
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                            <div class="info-box">
                                                <div class="info-label">
                                                    <lightning-icon icon-name="utility:file" size="xx-small"></lightning-icon>
                                                    BOOKING
                                                </div>
                                                <div class="info-value slds-truncate" title={bookingName}>{bookingName}</div>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                            <div class="info-box">
                                                <div class="info-label">
                                                    <lightning-icon icon-name="utility:home" size="xx-small"></lightning-icon>
                                                    PROJECT
                                                </div>
                                                <div class="info-value slds-truncate" title={projectName}>{projectName}</div>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                            <div class="info-box">
                                                <div class="info-label">
                                                    <lightning-icon icon-name="utility:snippet" size="xx-small"></lightning-icon>
                                                    UNIT
                                                </div>
                                                <div class="info-value slds-truncate" title={unitName}>{unitName}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Progress Bar -->
                                <template if:true={hasSchedules}>
                                    <div class="progress-section slds-m-bottom_medium">
                                        <div class="progress-header">
                                            <span class="progress-label">Payment Progress</span>
                                            <span class="progress-pct">{progressPercent}%</span>
                                        </div>
                                        <div class="progress-bar-track">
                                            <div class="progress-bar-fill" style={progressStyle}></div>
                                        </div>
                                        <div class="progress-stats">
                                            <span class="stat-item stat-paid">
                                                <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                                Paid: {paidCount}
                                            </span>
                                            <span class="stat-item stat-completed">
                                                <lightning-icon icon-name="utility:success" size="xx-small"></lightning-icon>
                                                Completed: {completedCount}
                                            </span>
                                            <span class="stat-item stat-pending">
                                                <lightning-icon icon-name="utility:priority" size="xx-small"></lightning-icon>
                                                Pending: {pendingCount}
                                            </span>
                                        </div>
                                    </div>
                                </template>

                                <!-- Table -->
                                <template if:true={hasSchedules}>
                                    <div class="slds-m-bottom_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_small custom-section-title">
                                            <lightning-icon icon-name="utility:table" size="x-small"></lightning-icon>
                                            PAYMENT SCHEDULES ({totalCount})
                                        </h3>

                                        <div class="custom-table-wrapper">
                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped custom-table">
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <th scope="col" class="custom-th slds-text-align_center"><div class="slds-truncate">S. No.</div></th>
                                                        <th scope="col" class="custom-th"><div class="slds-truncate">Name</div></th>
                                                        <th scope="col" class="custom-th"><div class="slds-truncate">Milestone</div></th>
                                                        <th scope="col" class="custom-th slds-text-align_right"><div class="slds-truncate">Amount</div></th>
                                                        <th scope="col" class="custom-th slds-text-align_center"><div class="slds-truncate">%</div></th>
                                                        <th scope="col" class="custom-th slds-text-align_center"><div class="slds-truncate">Status</div></th>
                                                        <th scope="col" class="custom-th slds-text-align_right"><div class="slds-truncate">Demandable Total</div></th>
                                                        <th scope="col" class="custom-th slds-text-align_right"><div class="slds-truncate">Flat Pending</div></th>
                                                        <th scope="col" class="custom-th slds-text-align_right"><div class="slds-truncate">GST Pending</div></th>
                                                        <th scope="col" class="custom-th slds-text-align_right"><div class="slds-truncate">TDS Pending</div></th>
                                                        <th scope="col" class="custom-th slds-text-align_right"><div class="slds-truncate">Interest</div></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={demandEligibleSchedules} for:item="schedule">
                                                        <tr key={schedule.id} class="slds-hint-parent">
                                                            <td data-label="S. No." class="slds-text-align_center">
                                                                <div class="slds-truncate">{schedule.serialNumber}</div>
                                                            </td>
                                                            <th scope="row" data-label="Name">
                                                                <div class="slds-truncate" title={schedule.name}>{schedule.name}</div>
                                                            </th>
                                                            <td data-label="Milestone">
                                                                <div class="slds-truncate" title={schedule.milestoneName}>{schedule.milestoneName}</div>
                                                            </td>
                                                            <td data-label="Amount" class="slds-text-align_right">
                                                                <span class="amount-text">{schedule.formattedAmount}</span>
                                                            </td>
                                                            <td data-label="Percentage" class="slds-text-align_center">
                                                                <span class="slds-badge slds-theme_default">{schedule.percentage}%</span>
                                                            </td>
                                                            <td data-label="Status" class="slds-text-align_center">
                                                                <template if:true={schedule.isCompleted}>
                                                                    <span class="slds-badge slds-theme_success">
                                                                        <lightning-icon icon-name="utility:success" size="xx-small"></lightning-icon>
                                                                        {schedule.status}
                                                                    </span>
                                                                </template>
                                                                <template if:true={schedule.isPaid}>
                                                                    <template if:false={schedule.isCompleted}>
                                                                        <span class="slds-badge slds-theme_success">
                                                                            <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                                                            {schedule.status}
                                                                        </span>
                                                                    </template>
                                                                </template>
                                                                <template if:false={schedule.isCompleted}>
                                                                    <template if:false={schedule.isPaid}>
                                                                        <span class="slds-badge slds-theme_warning">
                                                                            <lightning-icon icon-name="utility:priority" size="xx-small"></lightning-icon>
                                                                            {schedule.status}
                                                                        </span>
                                                                    </template>
                                                                </template>
                                                            </td>
                                                            <td data-label="Demandable Total" class="slds-text-align_right">
                                                                <span class="pending-text">{schedule.formattedDemandable}</span>
                                                            </td>
                                                            <td data-label="Flat Pending" class="slds-text-align_right">
                                                                <span>{schedule.formattedBasePending}</span>
                                                            </td>
                                                            <td data-label="GST Pending" class="slds-text-align_right">
                                                                <span>{schedule.formattedGstPending}</span>
                                                            </td>
                                                            <td data-label="TDS Pending" class="slds-text-align_right">
                                                                <span>{schedule.formattedTdsPending}</span>
                                                            </td>
                                                            <td data-label="Interest" class="slds-text-align_right">
                                                                <span class="interest-text">{schedule.formattedInterest}</span>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </template>

                                <!-- No Data -->
                                <template if:false={hasSchedules}>
                                    <div class="slds-align_absolute-center" style="min-height: 200px;">
                                        <lightning-icon icon-name="utility:info" size="large"></lightning-icon>
                                        <h3 class="slds-m-top_small">No Payment Schedules</h3>
                                        <p class="slds-m-top_x-small">No payment schedules found for this booking.</p>
                                    </div>
                                </template>

                            </template>
                        </template>
                    </div>

                    <!-- Footer -->
                    <footer class="slds-modal__footer custom-modal-footer">
                        <button class="slds-button slds-button_neutral" onclick={handleRefresh}>
                            <lightning-icon icon-name="utility:refresh" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Refresh
                        </button>
                        <button class="slds-button slds-button_brand" onclick={handleNext}>
                            Next
                            <lightning-icon icon-name="utility:forward" size="x-small" class="slds-m-left_x-small"></lightning-icon>
                        </button>
                    </footer>
                </div>
            </section>
        </div>
    </template>

    <!-- ==================== NEXT DEMAND VIEW ==================== -->
    <template if:true={showNextDemandView}>
        <div class="modal-container" onclick={handleBackdropClick}>
            <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_large" onclick={handleModalClick}>
                <div class="slds-modal__container custom-modal-container">
                    <header class="slds-modal__header custom-modal-header">
                        <button class="slds-button slds-button_icon slds-modal__close custom-close-btn"
                                title="Close" onclick={handleClose}>
                            <lightning-icon icon-name="utility:close" variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <div class="header-top-row">
                            <h2 class="slds-modal__title slds-text-heading_medium">
                                <lightning-icon icon-name="utility:moneybag" variant="inverse" size="small"></lightning-icon>
                                Next Payment Demand
                            </h2>
                            <div class="step-indicator">
                                <div class={step1DotClass}><span class="step-num">1</span></div>
                                <div class="step-line"></div>
                                <div class={step2DotClass}><span class="step-num">2</span></div>
                            </div>
                        </div>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium custom-modal-content">

                        <!-- Booking Info -->
                        <div class="slds-m-bottom_medium">
                            <div class="slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                    <div class="info-box">
                                        <div class="info-label">
                                            <lightning-icon icon-name="utility:file" size="xx-small"></lightning-icon>
                                            BOOKING
                                        </div>
                                        <div class="info-value slds-truncate" title={bookingName}>{bookingName}</div>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                    <div class="info-box">
                                        <div class="info-label">
                                            <lightning-icon icon-name="utility:home" size="xx-small"></lightning-icon>
                                            PROJECT
                                        </div>
                                        <div class="info-value slds-truncate" title={projectName}>{projectName}</div>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                    <div class="info-box">
                                        <div class="info-label">
                                            <lightning-icon icon-name="utility:snippet" size="xx-small"></lightning-icon>
                                            UNIT
                                        </div>
                                        <div class="info-value slds-truncate" title={unitName}>{unitName}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Last Completed Milestone -->
                        <div class="slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small custom-section-title">
                                <lightning-icon icon-name="utility:checkin" size="x-small"></lightning-icon>
                                LAST COMPLETED MILESTONE
                            </h3>
                            <div class="demand-card">
                                <div class="demand-row">
                                    <span class="demand-label">Milestone Name:</span>
                                    <span class="demand-value">{lastCompletedMilestone}</span>
                                </div>
                            </div>
                        </div>

                        <lightning-radio-group
                            name="demandComponent"
                            label="Demand component"
                            options={demandComponentOptions}
                            value={demandComponent}
                            type="button"
                            onchange={handleDemandComponentChange}
                            class="slds-m-bottom_medium">
                        </lightning-radio-group>

                        <template if:true={isFlatOnlyDemand}>
                            <div class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small custom-section-title">
                                    <lightning-icon icon-name="utility:table" size="x-small"></lightning-icon>
                                    FLAT DEMAND BREAKDOWN
                                </h3>
                                <div class="demand-card flat-demand-table-wrap">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered flat-demand-table flat-demand-wide">
                                        <thead>
                                            <tr>
                                                <th scope="col">Instalment Description</th>
                                                <th scope="col">% as per stage</th>
                                                <th scope="col">Full Instalment Amount (Flat + TDS)</th>
                                                <th scope="col">Flat Received Till Date</th>
                                                <th scope="col">TDS Received Till Date</th>
                                                <th scope="col">Instalment Amount to Demand (with TDS)</th>
                                                <th scope="col">TDS to Remit (Full Pending)</th>
                                                <th scope="col">Net Instalment Payable</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={demandLines} for:item="line">
                                                <tr key={line.id}>
                                                    <th scope="row">{line.milestoneName}</th>
                                                    <td>{line.percentage}%</td>
                                                    <td>{line.formattedFullScheduleWithTdsAmount}</td>
                                                    <td>{line.formattedReceivedFlatAmount}</td>
                                                    <td>{line.formattedReceivedTdsAmount}</td>
                                                    <td>{line.formattedAmountA}</td>
                                                    <td>{line.formattedTds}</td>
                                                    <td>{line.formattedNetAmount}</td>
                                                </tr>
                                            </template>
                                            <tr class="flat-demand-total-row">
                                                <th scope="row">TOTAL</th>
                                                <td></td>
                                                <td>{selectedDemand.formattedFullScheduleWithTdsAmount}</td>
                                                <td>{selectedDemand.formattedReceivedFlatAmount}</td>
                                                <td>{selectedDemand.formattedReceivedTdsAmount}</td>
                                                <td>{selectedDemand.formattedComponentAmount}</td>
                                                <td>{selectedDemand.formattedTdsAmount}</td>
                                                <td>{selectedDemand.formattedFlatAmount}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>

                        <template if:true={isGstOnlyDemand}>
                            <div class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small custom-section-title">
                                    <lightning-icon icon-name="utility:table" size="x-small"></lightning-icon>
                                    GST DEMAND BREAKDOWN
                                </h3>
                                <div class="demand-card flat-demand-table-wrap">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered flat-demand-table gst-demand-wide">
                                        <thead>
                                            <tr>
                                                <th scope="col">Instalment Description</th>
                                                <th scope="col">% as per stage</th>
                                                <th scope="col">Total Flat Amount (without GST)</th>
                                                <th scope="col">Total Flat Amount (with TDS)</th>
                                                <th scope="col">Full GST Amount</th>
                                                <th scope="col">GST Received Till Date</th>
                                                <th scope="col">GST Amount to Demand</th>
                                                <th scope="col">GST Payable</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={demandLines} for:item="line">
                                                <tr key={line.id}>
                                                    <th scope="row">{line.milestoneName}</th>
                                                    <td>{line.percentage}%</td>
                                                    <td>{line.formattedFullScheduleFlatAmount}</td>
                                                    <td>{line.formattedFullScheduleWithTdsAmount}</td>
                                                    <td>{line.formattedFullScheduleGstAmount}</td>
                                                    <td>{line.formattedReceivedGstAmount}</td>
                                                    <td>{line.formattedGstAmount}</td>
                                                    <td>{line.formattedGstAmount}</td>
                                                </tr>
                                            </template>
                                            <tr class="flat-demand-total-row">
                                                <th scope="row">TOTAL</th>
                                                <td></td>
                                                <td>{selectedDemand.formattedFullScheduleFlatAmount}</td>
                                                <td>{selectedDemand.formattedFullScheduleWithTdsAmount}</td>
                                                <td>{selectedDemand.formattedFullScheduleGstAmount}</td>
                                                <td>{selectedDemand.formattedReceivedGstAmount}</td>
                                                <td>{selectedDemand.formattedGstAmount}</td>
                                                <td>{selectedDemand.formattedGstAmount}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>

                        <template if:true={isCombinedDemand}>
                            <div class="slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small custom-section-title">
                                    <lightning-icon icon-name="utility:table" size="x-small"></lightning-icon>
                                    FULL DEMAND
                                </h3>
                                <div class="demand-card flat-demand-table-wrap">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered flat-demand-table full-demand-table">
                                        <thead>
                                            <tr>
                                                <th scope="col">Instalment Description</th>
                                                <th scope="col">% as per stage</th>
                                                <th scope="col">Total Amount to Demand (Flat + GST + TDS)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={demandLines} for:item="line">
                                                <tr key={line.id}>
                                                    <th scope="row">{line.milestoneName}</th>
                                                    <td>{line.percentage}%</td>
                                                    <td>{line.formattedSelectedDemand}</td>
                                                </tr>
                                            </template>
                                            <tr class="flat-demand-total-row">
                                                <th scope="row">TOTAL</th>
                                                <td></td>
                                                <td>{selectedDemand.formattedComponentAmount}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>

                        <!-- Detailed Calculation Breakdown -->
                        <template if:true={isGstOnlyDemand}>
                        <div class="slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small custom-section-title">
                                <lightning-icon icon-name="utility:calculator" size="x-small"></lightning-icon>
                                CALCULATION BREAKDOWN
                            </h3>
                            <div class="demand-card calc-card">
                                <div class="calc-group">
                                    <div class="calc-group-title">Demand Components</div>
                                    <template if:true={isFlatDemand}>
                                        <div class="demand-row">
                                            <span class="demand-label">Flat Amount:</span>
                                            <span class="demand-value">{selectedDemand.formattedFlatAmount}</span>
                                        </div>
                                    </template>
                                    <template if:true={isGstDemand}>
                                        <div class="demand-row">
                                            <span class="demand-label">GST Amount:</span>
                                            <span class="demand-value">{selectedDemand.formattedGstAmount}</span>
                                        </div>
                                    </template>
                                    <template if:true={isFlatDemand}>
                                        <div class="demand-row">
                                            <span class="demand-label">TDS Amount:</span>
                                            <span class="demand-value">{selectedDemand.formattedTdsAmount}</span>
                                        </div>
                                    </template>
                                </div>
                                <!-- Interest -->
                                <template if:true={hasAnyInterest}>
                                    <div class="calc-group">
                                        <div class="calc-group-title">Interest</div>
                                        <div class="demand-row">
                                            <span class="demand-label">Gross Interest Accrued:</span>
                                            <span class="demand-value amount-interest">{selectedDemand.formattedGrossInterest}</span>
                                        </div>
                                        <div class="demand-row">
                                            <span class="demand-label">Approved Waiver Applied:</span>
                                            <span class="demand-value amount-interest">{selectedDemand.formattedInterestWaivedOff}</span>
                                        </div>
                                        <div class="demand-row">
                                            <span class="demand-label">Interest Charged:</span>
                                            <span class="demand-value amount-interest">{selectedDemand.formattedInterest}</span>
                                        </div>
                                        <lightning-input
                                            type="checkbox"
                                            label="Include interest in this demand"
                                            checked={includeInterest}
                                            onchange={handleInterestChange}
                                            class="slds-m-top_small">
                                        </lightning-input>
                                    </div>
                                </template>

                                <!-- Grand Total -->
                                <div class="demand-row demand-total">
                                    <span class="demand-label">TOTAL AMOUNT DUE:</span>
                                    <span class="demand-value amount-total">{selectedDemand.formattedTotal}</span>
                                </div>
                            </div>
                        </div>
                        </template>

                        <template if:true={isCombinedDemand}>
                            <template if:true={hasAnyInterest}>
                                <div class="demand-card calc-card slds-m-bottom_medium">
                                    <div class="calc-group">
                                        <div class="demand-row">
                                            <span class="demand-label">Interest: {selectedDemand.formattedInterest}</span>
                                            <lightning-input
                                                type="checkbox"
                                                label="Include interest in this demand"
                                                checked={includeInterest}
                                                onchange={handleInterestChange}>
                                            </lightning-input>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>

                        <template if:true={isFlatOnlyDemand}>
                            <template if:true={hasAnyInterest}>
                                <div class="demand-card calc-card slds-m-bottom_medium">
                                    <div class="calc-group">
                                        <div class="calc-group-title">Interest</div>
                                        <div class="demand-row">
                                            <span class="demand-label">Gross Interest Accrued:</span>
                                            <span class="demand-value amount-interest">{selectedDemand.formattedGrossInterest}</span>
                                        </div>
                                        <div class="demand-row">
                                            <span class="demand-label">Approved Waiver Applied:</span>
                                            <span class="demand-value amount-interest">{selectedDemand.formattedInterestWaivedOff}</span>
                                        </div>
                                        <div class="demand-row">
                                            <span class="demand-label">Interest Charged:</span>
                                            <span class="demand-value amount-interest">{selectedDemand.formattedInterest}</span>
                                        </div>
                                        <lightning-input
                                            type="checkbox"
                                            label="Include interest in this demand"
                                            checked={includeInterest}
                                            onchange={handleInterestChange}
                                            class="slds-m-top_small">
                                        </lightning-input>
                                    </div>
                                </div>
                            </template>
                        </template>

                        <!-- Payment Due Date -->
                        <div class="slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small custom-section-title">
                                <lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>
                                PAYMENT DUE DATE
                            </h3>
                            <div class="demand-card demand-card-highlight">
                                <div class="demand-row">
                                    <span class="demand-label">Payment Expected By:</span>
                                    <span class="demand-value demand-date">{paymentDueDate}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Completed Schedules Count -->
                        <template if:true={isGstOnlyDemand}>
                        <div class="slds-m-bottom_small">
                            <div class="info-banner">
                                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_small"></lightning-icon>
                                <span>{completedSchedulesText} with pending amounts</span>
                            </div>
                        </div>
                        </template>

                    </div>
                    <footer class="slds-modal__footer custom-modal-footer">
                        <button class="slds-button slds-button_neutral" onclick={handleBack} disabled={isRaisingDemand}>
                            <lightning-icon icon-name="utility:back" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Back
                        </button>
                        <button type="button" class="slds-button slds-button_brand" onclick={handleRaiseDemand}>
                            <template if:true={isRaisingDemand}>
                                <lightning-spinner alternative-text="Raising..." size="small" class="slds-m-right_x-small"></lightning-spinner>
                            </template>
                            <template if:false={isRaisingDemand}>
                                <lightning-icon icon-name="utility:moneybag" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            </template>
                            Raise Demand
                        </button>
                    </footer>
                </div>
            </section>
        </div>
    </template>

</template>
